name: DevSphere Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-security-check:
    name: Repository & Secret Protection Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no committed build outputs (target/ directories)
        run: |
          echo "Checking for committed target/ directories..."
          COMMITTED_TARGETS=$(git ls-files | grep '/target/' || true)
          if [ -n "$COMMITTED_TARGETS" ]; then
            echo "ERROR: The following target/ files are tracked in Git:"
            echo "$COMMITTED_TARGETS"
            exit 1
          fi
          echo "PASSED: No target/ files tracked in Git."

      - name: Verify repository secret protection
        run: |
          echo "Scanning repository for accidental sensitive key files and secrets..."
          RESTRICTED_FILES=$(find . -name "*.env" -o -name "*.pem" -o -name "*.key" -o -name "*id_rsa*" | grep -v "/target/" | grep -v "/.git/" || true)
          if [ -n "$RESTRICTED_FILES" ]; then
            echo "ERROR: Accidental secret file(s) detected in repository:"
            echo "$RESTRICTED_FILES"
            exit 1
          fi
          echo "PASSED: No secret files detected."

      - name: Verify Config Server repo configuration files
        run: |
          echo "Validating config-repo contents for unencrypted production secrets..."
          SECRET_PATTERNS=$(grep -rnE "(password|secret|key|private)\s*:\s*[^\$\{]" config-repo/ || true)
          if [ -n "$SECRET_PATTERNS" ]; then
            echo "WARNING: Hardcoded literal secret patterns found in config-repo:"
            echo "$SECRET_PATTERNS"
          fi
          echo "PASSED: Config repository syntax and structure check complete."

      - name: Verify Java 21 declaration across pom.xml files
        run: |
          echo "Verifying Java version property in pom.xml files..."
          for pom in services/*/pom.xml; do
            echo "Checking $pom"
            grep -q "<java.version>21</java.version>" "$pom" || {
              echo "ERROR: $pom does not enforce <java.version>21</java.version>"
              exit 1
            }
          done
          echo "PASSED: All microservices enforce Java 21."

  service-build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: repository-security-check
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - service-discovery
          - config-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin) with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify service (${{ matrix.service }})
        run: |
          cd services/${{ matrix.service }}
          mvn clean verify -B

      - name: Upload Surefire & Failsafe Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Service Package Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 7

  dependency-security-scan:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    needs: repository-security-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Scan dependencies with OWASP Dependency-Check
        run: |
          echo "Running OWASP Dependency-Check security audit on microservice dependencies..."
          for service in services/*/; do
            if [ -f "${service}pom.xml" ]; then
              echo "Auditing dependencies for ${service}..."
              (cd "$service" && mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8.0 -DautoUpdate=true -B || echo "WARN: Dependency scan finished with potential advisories in ${service}")
            fi
          done

  docker-build-validation:
    name: Docker Build Validation (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: service-build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - service-discovery
          - config-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation Only - No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: devsphere/${{ matrix.service }}:${{ github.sha }}
