server:
  port: 8081

spring:
  application:
    name: DEVSPHERE-AUTH-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:devsphere_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

app:
  outbox:
    polling-interval: 1000
    batch-size: 50
    max-retries: 5

management:
  opentelemetry:
    resource-attributes:
      service.name: devsphere-auth-service
      service.version: 0.0.1-SNAPSHOT
      deployment.environment: ${SPRING_PROFILES_ACTIVE:development}

resilience4j:
  bulkhead:
    instances:
      authBulkhead:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
  timelimiter:
    instances:
      authTimeLimiter:
        timeoutDuration: 3s
