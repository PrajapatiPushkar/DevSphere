server:
  port: 8080

spring:
  application:
    name: DEVSPHERE-API-GATEWAY

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_REDIS_TIMEOUT:2000ms}

  cloud:
    gateway:
      routes:
        # Auth Service Registration Route (Strict IP-Based Rate Limiting)
        - id: auth-register-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/register
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@authRegisterRateLimiter}"
                routeId: "auth-register"
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth-service

        # Auth Service Login Route (Strict IP-Based Rate Limiting)
        - id: auth-login-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@authLoginRateLimiter}"
                routeId: "auth-login"
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth-service

        # Auth Service Default Route (Public IP-Based Rate Limiting)
        - id: auth-service-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@publicDefaultRateLimiter}"
                routeId: "auth-service"
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth-service

        # User Service Route (Protected Identity-Based Rate Limiting)
        - id: user-service-route
          uri: lb://DEVSPHERE-USER-SERVICE
          predicates:
            - Path=/api/v1/users/**, /api/v1/profile/**, /api/v1/goals/**, /api/v1/tasks/**, /api/v1/planner/**, /api/v1/dsa/**, /api/v1/projects/**, /api/v1/career-profile/**, /api/v1/experience/**, /api/v1/education/**, /api/v1/skills/**, /api/v1/certifications/**, /api/v1/resumes/**, /api/v1/public/**
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@userKeyResolver}"
                rateLimiter: "#{@authenticatedUserRateLimiter}"
                routeId: "user-service"
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # Temporary Verification Route (Lesson 3 / Lesson 6 Verification Stub)
        - id: temporary-demo-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/demo/**
          filters:
            - RewritePath=/api/demo/(?<segment>.*), /internal/demo/$\{segment}

app:
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    fail-open: ${APP_RATE_LIMIT_FAIL_OPEN:true}
    timeout-ms: ${APP_RATE_LIMIT_TIMEOUT_MS:2000}
    login:
      replenish-rate: 5
      burst-capacity: 10
    registration:
      replenish-rate: 5
      burst-capacity: 10
    authenticated:
      replenish-rate: 20
      burst-capacity: 40
    public-default:
      replenish-rate: 10
      burst-capacity: 20

management:
  health:
    redis:
      enabled: false
  opentelemetry:
    resource-attributes:
      service.name: devsphere-api-gateway
      service.version: 0.0.1-SNAPSHOT
      deployment.environment: ${SPRING_PROFILES_ACTIVE:development}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      userServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      userServiceCircuitBreaker:
        baseConfig: default
