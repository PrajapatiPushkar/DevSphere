apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-zookeeper
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-zookeeper
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsphere-zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsphere-zookeeper
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: devsphere
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
              name: zookeeper
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devsphere-zookeeper
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-zookeeper
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 2181
      targetPort: 2181
      protocol: TCP
      name: zookeeper
  selector:
    app.kubernetes.io/name: devsphere-zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-kafka
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsphere-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsphere-kafka
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: devsphere
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: kafka
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "devsphere-zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://devsphere-kafka.devsphere.svc.cluster.local:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devsphere-kafka
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: kafka
  selector:
    app.kubernetes.io/name: devsphere-kafka
