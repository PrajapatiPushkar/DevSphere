apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-redis
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsphere-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsphere-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: devsphere
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devsphere-redis
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: devsphere-redis
