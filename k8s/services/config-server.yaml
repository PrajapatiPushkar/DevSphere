apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-config-server
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-config-server
    app.kubernetes.io/component: config-server
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devsphere-config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsphere-config-server
        app.kubernetes.io/component: config-server
        app.kubernetes.io/part-of: devsphere
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-server
          image: ghcr.io/prajapatipushkar/devsphere-config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: devsphere-configmap
            - secretRef:
                name: devsphere-secrets
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: "file:/config-repo"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: config-repo-volume
              mountPath: /config-repo
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: config-repo-volume
          configMap:
            name: devsphere-config-repo
---
apiVersion: v1
kind: Service
metadata:
  name: devsphere-config-server
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-config-server
    app.kubernetes.io/component: config-server
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: devsphere-config-server
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: devsphere
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/component: config-server
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: devsphere-config-server
