apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.devsphere.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevSphere Dashboards'
        orgId: 1
        folder: 'DevSphere'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-devsphere
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  devsphere-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Service Target Status (UP)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "count(up{job=~\"api-gateway|auth-service|user-service|config-server|service-discovery\"} == 1)",
              "legendFormat": "Healthy Services"
            }
          ]
        },
        {
          "title": "Active In-Flight Requests",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(http_server_requests_active_seconds_count) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "Total HTTP Request Rate (ops/sec)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m]))",
              "legendFormat": "Global Rate"
            }
          ]
        },
        {
          "title": "Service Availability Matrix",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "up{job=~\"api-gateway|auth-service|user-service|config-server|service-discovery\"}",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "HTTP Request Rate by Service (ops/sec)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "HTTP 5xx Server Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (job)",
              "legendFormat": "{{job}} 5xx"
            }
          ]
        },
        {
          "title": "Average Request Latency (seconds)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum[1m])) by (job) / sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}} avg"
            }
          ]
        },
        {
          "title": "Peak Request Latency (seconds)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "max(http_server_requests_seconds_max) by (job)",
              "legendFormat": "{{job}} max"
            }
          ]
        },
        {
          "title": "JVM Heap Memory Usage (bytes)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "{{job}} used"
            },
            {
              "expr": "jvm_memory_max_bytes{area=\"heap\"}",
              "legendFormat": "{{job}} max"
            }
          ]
        },
        {
          "title": "JVM Non-Heap Memory Usage (bytes)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"nonheap\"}",
              "legendFormat": "{{job}} non-heap"
            }
          ]
        },
        {
          "title": "JVM Live Threads",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "targets": [
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{job}} threads"
            }
          ]
        },
        {
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "targets": [
            {
              "expr": "process_cpu_usage",
              "legendFormat": "{{job}} cpu"
            }
          ]
        },
        {
          "title": "Kafka Consumer Partition Lag (Records)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 36},
          "targets": [
            {
              "expr": "kafka_consumer_fetch_manager_records_lag_max",
              "legendFormat": "{{client_id}} - {{topic}}"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["devsphere", "observability"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "title": "DevSphere Production Monitoring",
      "uid": "devsphere-production-monitoring"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: devsphere
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "250m"
              memory: "200Mi"
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsphere-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-volume
              mountPath: /etc/grafana/dashboards
            - name: storage-volume
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: provider-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-volume
          configMap:
            name: grafana-dashboard-devsphere
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: grafana
