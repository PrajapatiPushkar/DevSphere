apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevSphere Dashboards'
        orgId: 1
        folder: 'DevSphere'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-devsphere
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
data:
  devsphere-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "HTTP Request Rate (ops/sec)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "HTTP 5xx Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) by (job)",
              "legendFormat": "{{job}} errors"
            }
          ]
        },
        {
          "title": "P95 Request Latency (seconds)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "{{job}} p95"
            }
          ]
        },
        {
          "title": "Active Requests",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(http_server_requests_active_seconds_count) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "JVM Heap Memory Usage (bytes)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "{{job}} used"
            },
            {
              "expr": "jvm_memory_max_bytes{area=\"heap\"}",
              "legendFormat": "{{job}} max"
            }
          ]
        },
        {
          "title": "JVM Live Thread Count",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "Kafka Events Processed & Errors",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {
              "expr": "sum(rate(devsphere_kafka_events_processed_total[5m])) by (event_type, status)",
              "legendFormat": "{{event_type}} - {{status}}"
            },
            {
              "expr": "sum(rate(devsphere_kafka_duplicate_events_total[5m])) by (event_type)",
              "legendFormat": "{{event_type}} duplicate"
            }
          ]
        },
        {
          "title": "Redis Cache Performance (Hits vs Misses)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "targets": [
            {
              "expr": "sum(rate(devsphere_cache_hits_total[5m])) by (cache)",
              "legendFormat": "{{cache}} hits"
            },
            {
              "expr": "sum(rate(devsphere_cache_misses_total[5m])) by (cache)",
              "legendFormat": "{{cache}} misses"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["devsphere", "observability"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "title": "DevSphere Production Monitoring",
      "uid": "devsphere-production-monitoring"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: devsphere
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsphere-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-volume
              mountPath: /var/lib/grafana/dashboards
            - name: storage-volume
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: provider-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-volume
          configMap:
            name: grafana-dashboard-devsphere
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devsphere
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: devsphere
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: grafana
