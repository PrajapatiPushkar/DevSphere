server:
  port: 0

spring:
  application:
    name: user-service-test

  datasource:
    url: jdbc:h2:mem:devsphere_user_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    admin:
      auto-create: false
    listener:
      auto-startup: false
    consumer:
      group-id: devsphere-user-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.devsphere.user.event.UserRegisteredEvent

management:
  endpoints:
    web:
      exposure:
        include: health
