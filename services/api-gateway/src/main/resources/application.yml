server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Auth Service Route (Public Registration & Login)
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # User Service Route (Protected User Profiles)
        - id: user-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

        # Temporary Verification Route (Lesson 3 / Lesson 6 Verification Stub)
        - id: temporary-demo-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/demo/**
          filters:
            - RewritePath=/api/demo/(?<segment>.*), /internal/demo/$\{segment}

jwt:
  secret: ${JWT_SECRET:devsphere-super-secret-jwt-signing-key-for-local-development-must-be-at-least-256-bits-long}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
