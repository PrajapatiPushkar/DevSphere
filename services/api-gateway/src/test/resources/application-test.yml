server:
  port: 0

spring:
  application:
    name: DEVSPHERE-API-GATEWAY-TEST

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-route
          uri: lb://DEVSPHERE-USER-SERVICE
          predicates:
            - Path=/api/v1/users/**

        - id: temporary-demo-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/demo/**
          filters:
            - RewritePath=/api/demo/(?<segment>.*), /internal/demo/$\{segment}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: devsphere-super-secret-jwt-signing-key-for-local-development-must-be-at-least-256-bits-long

management:
  endpoints:
    web:
      exposure:
        include: health
