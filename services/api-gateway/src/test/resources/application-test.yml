server:
  port: 0

spring:
  application:
    name: DEVSPHERE-API-GATEWAY-TEST
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: auth-register-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/register
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@authRegisterRateLimiter}"
                routeId: "auth-register"

        - id: auth-login-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@authLoginRateLimiter}"
                routeId: "auth-login"

        - id: auth-service-route
          uri: lb://DEVSPHERE-AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@ipKeyResolver}"
                rateLimiter: "#{@publicDefaultRateLimiter}"
                routeId: "auth-service"

        - id: user-service-route
          uri: lb://DEVSPHERE-USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: DistributedRateLimiter
              args:
                keyResolver: "#{@userKeyResolver}"
                rateLimiter: "#{@authenticatedUserRateLimiter}"
                routeId: "user-service"

        - id: temporary-demo-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/demo/**
          filters:
            - RewritePath=/api/demo/(?<segment>.*), /internal/demo/$\{segment}

app:
  rate-limit:
    enabled: true
    fail-open: true
    timeout-ms: 2000
    login:
      replenish-rate: 5
      burst-capacity: 10
    registration:
      replenish-rate: 5
      burst-capacity: 10
    authenticated:
      replenish-rate: 20
      burst-capacity: 40
    public-default:
      replenish-rate: 10
      burst-capacity: 20

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: devsphere-super-secret-jwt-signing-key-for-local-development-must-be-at-least-256-bits-long

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
