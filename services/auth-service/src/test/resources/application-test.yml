server:
  port: 0

spring:
  application:
    name: auth-service-test
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:devsphere_auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    admin:
      auto-create: false
    producer:
      retries: 0
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: devsphere-super-secret-jwt-signing-key-for-local-development-must-be-at-least-256-bits-long
  expiration-seconds: 3600

app:
  outbox:
    polling-interval: 600000
    batch-size: 50
    max-retries: 5

management:
  endpoints:
    web:
      exposure:
        include: health
