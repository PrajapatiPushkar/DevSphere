server:
  port: 0

spring:
  application:
    name: auth-service-test

  datasource:
    url: jdbc:h2:mem:devsphere_auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: devsphere-super-secret-jwt-signing-key-for-local-development-must-be-at-least-256-bits-long
  expiration-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health
