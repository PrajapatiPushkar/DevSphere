apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsphere-ingress
spec:
  tls: []
  rules:
    - host: api.devsphere.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsphere-api-gateway
                port:
                  number: 8080
