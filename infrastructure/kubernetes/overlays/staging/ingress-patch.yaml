apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsphere-ingress
spec:
  tls:
    - hosts:
        - staging-api.devsphere.example.com
      secretName: devsphere-staging-api-tls
  rules:
    - host: staging-api.devsphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsphere-api-gateway
                port:
                  number: 8080
