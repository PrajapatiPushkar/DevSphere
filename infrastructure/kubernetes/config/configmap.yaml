apiVersion: v1
kind: ConfigMap
metadata:
  name: devsphere-configmap
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-configmap
    app.kubernetes.io/part-of: devsphere
data:
  SPRING_PROFILES_ACTIVE: "prod"
  CONFIG_SERVER_URL: "http://config-server.devsphere.svc.cluster.local:8888"
  EUREKA_SERVER_URL: "http://service-discovery.devsphere.svc.cluster.local:8761/eureka"
  SPRING_REDIS_HOST: "redis.devsphere.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.devsphere.svc.cluster.local:9092"
  MYSQL_HOST: "mysql.devsphere.svc.cluster.local"
  MYSQL_PORT: "3306"
  APP_RATE_LIMIT_ENABLED: "true"
  APP_RATE_LIMIT_FAIL_OPEN: "true"
