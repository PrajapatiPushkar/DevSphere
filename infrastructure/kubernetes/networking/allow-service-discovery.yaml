apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-discovery
  namespace: devsphere
  labels:
    app.kubernetes.io/name: allow-service-discovery
    app.kubernetes.io/part-of: devsphere
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsphere-service-discovery
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-auth-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-user-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-config-server
      ports:
        - protocol: TCP
          port: 8761
