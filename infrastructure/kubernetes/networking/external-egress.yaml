apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-infrastructure-egress
  namespace: devsphere
  labels:
    app.kubernetes.io/name: allow-external-infrastructure-egress
    app.kubernetes.io/part-of: devsphere
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - devsphere-auth-service
          - devsphere-user-service
          - devsphere-api-gateway
  policyTypes:
    - Egress
  egress:
    # Kafka Egress (Auth, User)
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29092
    # Redis Egress (Gateway, User)
    - ports:
        - protocol: TCP
          port: 6379
    # MySQL Egress (Auth, User)
    - ports:
        - protocol: TCP
          port: 3306
