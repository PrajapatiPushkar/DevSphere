apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsphere-service-discovery
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-service-discovery
    app.kubernetes.io/component: service-discovery
    app.kubernetes.io/part-of: devsphere
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsphere-service-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsphere-service-discovery
        app.kubernetes.io/component: service-discovery
        app.kubernetes.io/part-of: devsphere
    spec:
      serviceAccountName: devsphere-service-discovery
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-discovery
          image: ghcr.io/OWNER/devsphere-service-discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          envFrom:
            - configMapRef:
                name: devsphere-configmap
            - secretRef:
                name: devsphere-secrets
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
