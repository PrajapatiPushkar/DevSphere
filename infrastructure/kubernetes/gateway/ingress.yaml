apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsphere-ingress
  namespace: devsphere
  labels:
    app.kubernetes.io/name: devsphere-ingress
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: devsphere
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.devsphere.example.com
      secretName: devsphere-api-tls
  rules:
    - host: api.devsphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsphere-api-gateway
                port:
                  number: 8080
