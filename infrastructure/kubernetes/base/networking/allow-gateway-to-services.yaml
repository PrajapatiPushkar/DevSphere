apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  labels:
    app.kubernetes.io/name: allow-gateway-to-services
    app.kubernetes.io/part-of: devsphere
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsphere-api-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-auth-service
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-user-service
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-config-server
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsphere-service-discovery
      ports:
        - protocol: TCP
          port: 8761
    - ports:
        - protocol: TCP
          port: 6379
