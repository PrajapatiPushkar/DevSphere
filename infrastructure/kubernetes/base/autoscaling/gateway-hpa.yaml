apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devsphere-api-gateway-hpa
  labels:
    app.kubernetes.io/name: devsphere-api-gateway-hpa
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: devsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devsphere-api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
